[project]
name = "super-agents"
version = "2.0.0"
description = "AICODE Labs - AI-native software development company composed of autonomous agents"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "AICODE Labs", email = "soon@mail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
aicode = "cli:cli"

[project.urls]
Homepage = "https://github.com/Nom-nom-hub/super-agents"
Repository = "https://github.com/Nom-nom-hub/super-agents"