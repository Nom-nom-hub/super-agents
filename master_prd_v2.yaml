meta:
  version: 2.0.0
  name: AICODE Labs
  intent: >
    Full AI-native software development company composed of autonomous agents.
    Agents operate entirely from YAML + Markdown specifications. This version includes
    cognitive reasoning, governance, expanded agent roster, and orchestration flow.

organization:
  hierarchy:
    - division: Executive
      roles:
        - id: ceo
          title: Chief Executive Officer Agent
          mission: >
            Direct company vision, allocate resources, and approve production releases.
          delegates_to: [cto, coo, product_manager, meta_architect]
        - id: cto
          title: Chief Technology Officer Agent
          mission: >
            Architect AI systems, define tech standards, ensure scalability.
          delegates_to: [backend_engineer, frontend_engineer, ai_engineer, devops_engineer]
        - id: coo
          title: Chief Operations Officer Agent
          mission: >
            Oversee workflows, scheduling, resource distribution.
          delegates_to: [reliability_engineer, qa_engineer, security_engineer, ops_automator]

    - division: Product
      roles:
        - id: product_manager
          title: Product Manager Agent
          mission: Translate user needs and market data into actionable specifications.
          inputs: [market_analysis.md]
          outputs: [product_specifications.yaml]
        - id: ux_designer
          title: UX/UI Designer Agent
          mission: Design interfaces and user experiences.
          outputs: [ui_flows.md, design_system.yaml]
        - id: market_analyst
          title: Market Analyst Agent
          mission: Gather user insights and market trends.
          outputs: [market_trends.md]

    - division: Engineering
      roles:
        - id: backend_engineer
          title: Backend Engineer Agent
          mission: Build core APIs, database layers, and business logic.
          tools: [Python, FastAPI, PostgreSQL]
          inputs: [product_specifications.yaml]
          outputs: [api_service/, database_schema.sql]
        - id: frontend_engineer
          title: Frontend Engineer Agent
          mission: Implement user interfaces and state management.
          tools: [Next.js, TypeScript, TailwindCSS]
          inputs: [ui_flows.md]
          outputs: [frontend_app/]
        - id: ai_engineer
          title: AI Engineer Agent
          mission: Design and optimize AI models, pipelines, and agent reasoning chains.
          tools: [Python, LangChain, OpenAI API, Ollama]
          inputs: [ai_requirements.yaml]
          outputs: [ai_modules/]
        - id: devops_engineer
          title: DevOps Engineer Agent
          mission: Manage CI/CD, deployment, and observability.
          tools: [Docker, Kubernetes, GitHub Actions]
          outputs: [deployment_pipeline.yaml]
        - id: builder_engineer
          title: Spec Builder Agent
          mission: Convert YAML/MD specs into runnable codebases, manage dependencies, generation logs.
          inputs: [/company/agents/**/*.yaml, /company/agents/**/*.md]
          outputs: [generated_codebase/]

    - division: Quality
      roles:
        - id: qa_engineer
          title: Quality Assurance Agent
          mission: Validate functionality and run integration tests.
          tools: [pytest, Playwright]
          inputs: [build_artifacts/]
          outputs: [qa_report.md]
        - id: reliability_engineer
          title: Reliability Engineer Agent
          mission: Monitor system health and ensure uptime.
          tools: [Prometheus, Grafana]
          outputs: [reliability_dashboard.yaml]

    - division: Security
      roles:
        - id: security_engineer
          title: Security Agent
          mission: Handle authentication, secrets, and audits.
          outputs: [security_policies.yaml, audit_logs/]

    - division: Knowledge
      roles:
        - id: tech_writer
          title: Technical Writer Agent
          mission: Generate documentation and API references.
          inputs: [codebase/, api_service/]
          outputs: [docs/]
        - id: knowledge_architect
          title: Knowledge Architect Agent
          mission: Maintain knowledge graph and shared vector memory.
          outputs: [knowledge_index.yaml, memory_snapshots/]

    - division: Governance
      roles:
        - id: meta_architect
          title: Meta Architect Agent
          mission: Manage and evolve agent specs, validate compliance, introduce new capabilities.
          controls: [/company/agents/**, /schemas/**]
          outputs: [schema_updates.yaml, evolution_plan.md]

    - division: Expansion
      roles:
        - id: finance_agent
          title: Finance Agent
          mission: Manage budgets, cost modeling, and API key allocation.
          outputs: [financial_reports.yaml]
        - id: partnership_agent
          title: Partnership Agent
          mission: Manage external integrations and collaborations.
          outputs: [partner_contracts.yaml]
        - id: prompt_engineer
          title: Prompt Engineer Agent
          mission: Optimize prompts for all AI agents dynamically.
          outputs: [prompt_library.yaml]
        - id: research_agent
          title: Research Agent
          mission: Explore new models, tools, and techniques continuously.
          outputs: [research_findings.md]
        - id: ops_automator
          title: Operations Automator Agent
          mission: Automate maintenance, data sync, and reporting tasks.
          outputs: [automation_scripts/]

runtime:
  execution_model:
    load_order: [meta_architect, cto, coo, product_manager]
    communication_protocol: graph
    persistence: vector_memory_db
    governance: human_review_required_for_production
  file_structure:
    - /company/master_prd_v2.yaml
    - /company/agents/*.yaml
    - /company/agents/*.md
    - /company/schemas/**
    - /company/output/**
  default_workflow:
    - meta_architect generates agent templates
    - product_manager creates product specs
    - engineers build components
    - qa validates
    - tech_writer documents
    - coo releases
    - ceo signs off

cognition:
  reasoning_protocols:
    - reflection: daily
    - decision_weighting: role_priority
    - conflict_resolution: majority_voting
  collaboration_patterns:
    - peer_review
    - consensus_merging
  context_alignment:
    shared_vocab: company_terms.yaml
    memory_scope: project
    weighting:
      engineering: 0.9
      product: 0.8
      governance: 0.7

governance:
  review_threshold: 0.85
  human_review_required: true
  signoff_agents: [ceo, cto]
  compliance_domains: [security, privacy, model_safety]
  audit_log: /company/audit_log/

knowledge_index:
  vector_db: /company/memory/vector_store/
  embeddings_model: openai/text-embedding-3-large
  sync_frequency: hourly
  shared_contexts: [engineering/, product/, governance/]

deliverables:
  - autonomous AI dev organization
  - generated agent specs from master PRD
  - orchestrator-ready workflow definitions
  - cognitive and governance policies
  - knowledge graph for agent memory