# AICODE Labs Runtime Configuration

runtime_version: 2.0.0
company_name: AICODE Labs
execution_model: graph

# Agent Communication Settings
communication:
  protocol: graph
  message_queue: redis://localhost:6379
  persistence: vector_memory_db
  security: encrypted_channels

# Agent Lifecycle Management
lifecycle:
  startup_order:
    - meta_architect
    - ceo
    - cto
    - coo
    - product_manager
    - market_analyst
    - ux_designer
    - backend_engineer
    - frontend_engineer
    - ai_engineer
    - devops_engineer
    - builder_engineer
    - qa_engineer
    - reliability_engineer
    - security_engineer
    - tech_writer
    - knowledge_architect
    - finance_agent
    - partnership_agent
    - prompt_engineer
    - research_agent
    - ops_automator
  health_check_interval: 30s
  restart_policy: always

# Governance Settings
governance:
  human_review_required_for_production: true
  approval_thresholds:
    - level: development
      approval_required: false
    - level: staging
      approval_required: true
    - level: production
      approval_required: true
  audit_logging: true
  review_threshold: 0.85
  signoff_agents: ["ceo", "cto"]

# Resource Allocation
resources:
  cpu_allocation:
    high_priority: ["ceo", "cto", "meta_architect", "builder_engineer", "prompt_engineer"]
    medium_priority: ["product_manager", "engineering", "devops", "finance_agent", "research_agent"]
    standard_priority: ["qa", "security", "documentation", "partnership_agent", "ops_automator"]
  memory_limits:
    executive_agents: 4GB
    engineering_agents: 8GB
    ai_agents: 12GB
    support_agents: 2GB

# Monitoring and Observability
monitoring:
  metrics_endpoint: /metrics
  logging_level: info
  performance_monitoring: true
  error_tracking: true

# Cognitive Reasoning Settings
cognition:
  reflection_interval: daily
  decision_weighting: role_priority
  conflict_resolution: majority_voting
  collaboration_patterns:
    - peer_review
    - consensus_merging
  context_alignment:
    shared_vocab: company_terms.yaml
    memory_scope: project
    weighting:
      engineering: 0.9
      product: 0.8
      governance: 0.7

# Knowledge Management
knowledge_index:
  vector_db: /company/memory/vector_store/
  embeddings_model: openai/text-embedding-3-large
  sync_frequency: hourly
  shared_contexts: ["engineering/", "product/", "governance/"]
  compliance_domains: ["security", "privacy", "model_safety"]
  audit_log: /company/audit_log/